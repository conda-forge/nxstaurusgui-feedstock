schema_version: 1

context:
  version: "1.4.0"

package:
  name: nxstaurusgui
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/nxsmacrogui/archive/refs/tags/v${{ version }}.tar.gz
  sha256: dd2f99fffb2efd1f8cf424e8ad7c78285293dbe9184f5ae9566bf82b8088a233

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pytango
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - pytango
    - taurus
    - sardana
    - nxselector

tests:
  - python:
      imports:
        - nxstaurusgui
        - nxstaurusgui.serverinfo
        - nxstaurusgui.heartbeat
        - nxstaurusgui.config
        - nxstaurusgui.NXSMacroGUI
        - nxstaurusgui.data

      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - if: unix
        then:
          - test -x "$PREFIX/bin/nxsmacrogui"
          - QT_QPA_PLATFORM=offscreen nxsmacrogui --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/nexdatas/nxsmacrogui
  repository: https://github.com/nexdatas/nxsmacrogui
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXus Macro Component Selector GUI
  description: |
    NeXus MacroGUI is taurus GUI Configuration for Component Selector

extra:
  recipe-maintainers:
    - jkotan
